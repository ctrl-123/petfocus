<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="自律岛">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf3e6" />
      <stop offset="100%" stop-color="#efdfc4" />
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6c177" />
      <stop offset="70%" stop-color="#e8a33d" />
      <stop offset="100%" stop-color="#d08f2c" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)" />

  <!-- 耳朵 -->
  <circle cx="176" cy="186" r="56" fill="#e8a33d" />
  <circle cx="336" cy="186" r="56" fill="#e8a33d" />

  <!-- 身体 -->
  <ellipse cx="256" cy="300" rx="132" ry="122" fill="url(#body)" />

  <!-- 眼睛 -->
  <ellipse cx="212" cy="288" rx="17" ry="22" fill="#3a2f28" />
  <ellipse cx="300" cy="288" rx="17" ry="22" fill="#3a2f28" />

  <!-- 嘴 -->
  <path d="M232 336 q24 26 48 0" fill="none" stroke="#3a2f28" stroke-width="10" stroke-linecap="round" />

  <!-- 蝴蝶结：位于两耳之间，与宠物渲染器同一构图 -->
  <path d="M248 176 L206 154 q-10 22 0 44 Z" fill="#ef6f9b" stroke="#c94f78" stroke-width="6" stroke-linejoin="round" />
  <path d="M264 176 L306 154 q10 22 0 44 Z" fill="#ef6f9b" stroke="#c94f78" stroke-width="6" stroke-linejoin="round" />
  <rect x="242" y="162" width="28" height="32" rx="10" fill="#f58fb2" stroke="#c94f78" stroke-width="6" />
</svg>
