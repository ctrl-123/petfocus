# 部署到 GitHub Pages。
#
# 为什么用 GitHub Pages 而不是 Vercel：
# Vercel 注册要求手机短信验证，而它的风控（Twilio）对大量号码失败，
# 官方社区里满是"收不到验证码 / 号码被封锁 12 小时"的求助帖。
# GitHub Pages 不需要任何额外账号与手机验证——仓库本来就在 GitHub 上。
#
# 站点地址：https://ctrl-123.github.io/petfocus/
# ⚠️ 因为站点在 `/petfocus/` 子目录下，构建时必须传 `BASE_PATH=/petfocus/`，
#    否则所有静态资源路径都会 404（见 apps/web/vite.config.ts 的说明）。
#
# 前置条件（只需在 GitHub 网页上设置一次）：
#   Settings → Pages → Build and deployment → Source 选 **GitHub Actions**
name: deploy-pages

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# GITHUB_TOKEN 需要这些权限才能发布 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只跑一个部署；排队中的旧任务直接取消，避免覆盖新版本
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ⚠️ 不要写 `version:`。
      # package.json 里已有 `packageManager: "pnpm@9.15.4"`；
      # 一旦这里再指定 version，pnpm/action-setup 会以
      # "Multiple versions of pnpm specified" 直接失败（10 秒内退出）。
      # 让它读 packageManager 字段即可，也保证 CI 与本地版本一致。
      - uses: pnpm/action-setup@v4

      # Node 版本与开发机保持一致（本机 v24）。
      # 不要降到 22：`--experimental-strip-types` 与 `--test` 的 glob 支持都有差异。
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 构建前先跑验证：宁可不部署，也不要部署一个测试挂掉的版本
      - name: 类型检查
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: 测试
        run: pnpm test

      - name: 构建（子路径 /petfocus/）
        run: pnpm build
        env:
          BASE_PATH: /petfocus/

      # ⚠️ 必须先在 GitHub 网页上把 Pages 的 Source 设为「GitHub Actions」。
      # 只设一次即可；GitHub 会据此创建 Pages 站点，之后本工作流永久可用。
      #
      # 为什么不能靠 enablement: true 自动创建：
      # 创建 Pages 站点属于**仓库管理级操作**，而自动的 GITHUB_TOKEN
      # 在任何 permissions 配置下都无法执行管理操作（这是刻意的安全边界）。
      # 加了 enablement: true 只会把 "Get Pages site failed" 换成
      # "Resource not accessible by integration"，仍然失败。
      #
      # 也不要指望 GitHub Pages 的「Static HTML」预设按钮：
      # 那是给"把 HTML 直接提交到分支"用的，会与本工作流冲突。
      - name: 配置 Pages
        id: configure
        uses: actions/configure-pages@v5
        with:
          # 显式声明不尝试自动启用：靠上面那次网页设置。
          # 这样失败时的错误信息就是真正的 "Get Pages site failed"，
          # 而不是被 enablement 掩盖成 "Resource not accessible by integration"。
          enablement: false

      # 只在配置失败时给出可执行的指引。
      # 用 outcome 判断而不是 if: failure()，后者会连带影响后续步骤是否执行，语义不清晰。
      - name: 给出修复指引
        if: steps.configure.outcome == 'failure'
        run: |
          echo "=================================================="
          echo "  Pages is not enabled yet, or the setting has not"
          echo "  taken effect on GitHub's side."
          echo ""
          echo "  Fix: Settings > Pages > Build and deployment"
          echo "       Source = GitHub Actions"
          echo "  Then come back to Actions and click 'Re-run all jobs'."
          echo ""
          echo "  Do NOT click the 'Static HTML' preset button: it is for"
          echo "  committing HTML to a branch and conflicts with this workflow."
          echo "=================================================="
          exit 1

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
