# 部署到 GitHub Pages。
#
# 为什么用 GitHub Pages 而不是 Vercel：
# Vercel 注册要求手机短信验证，而它的风控（Twilio）对大量号码失败，
# 官方社区里满是"收不到验证码 / 号码被封锁 12 小时"的求助帖。
# GitHub Pages 不需要任何额外账号与手机验证——仓库本来就在 GitHub 上。
#
# 站点地址：https://ctrl-123.github.io/petfocus/
# ⚠️ 因为站点在 `/petfocus/` 子目录下，构建时必须传 `BASE_PATH=/petfocus/`，
#    否则所有静态资源路径都会 404（见 apps/web/vite.config.ts 的说明）。
#
# 前置条件（只需在 GitHub 网页上设置一次）：
#   Settings → Pages → Build and deployment → Source 选 **GitHub Actions**
name: deploy-pages

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# GITHUB_TOKEN 需要这些权限才能发布 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只跑一个部署；排队中的旧任务直接取消，避免覆盖新版本
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ⚠️ 不要写 `version:`。
      # package.json 里已有 `packageManager: "pnpm@9.15.4"`；
      # 一旦这里再指定 version，pnpm/action-setup 会以
      # "Multiple versions of pnpm specified" 直接失败（10 秒内退出）。
      # 让它读 packageManager 字段即可，也保证 CI 与本地版本一致。
      - uses: pnpm/action-setup@v4

      # Node 版本与开发机保持一致（本机 v24）。
      # 不要降到 22：`--experimental-strip-types` 与 `--test` 的 glob 支持都有差异。
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 构建前先跑验证：宁可不部署，也不要部署一个测试挂掉的版本
      - name: 类型检查
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: 测试
        run: pnpm test

      - name: 构建（子路径 /petfocus/）
        run: pnpm build
        env:
          BASE_PATH: /petfocus/

      # 让 Pages 直到站点根路径，PWA 的 scope 才不会跑偏
      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
